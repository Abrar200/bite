{% extends "restaurants/base.html" %}
{% load static %}

{% block content %}
<section class="login_main d-block" style="margin-bottom: 160px;">
    <div class="container-fluid">
        <div class="row h-100 align-items-center">
            <div class="col-md-6 h-100 order-md-1 order-2 p-0">
                <form method="POST" action="{% url 'password_reset' restaurant_slug=restaurant_slug %}" class="h-100">
                    {% csrf_token %}
                    <div class="d-flex flex-column h-100 py-5 px-4 p-md-5 justify-content-center w-100 align-items-start gap-4">
                        <div class="d-flex flex-column gap-2">
                            <h1>Forgot Password</h1>
                            <p>Enter your email to receive a password reset link.</p>
                        </div>
                        <div class="d-flex flex-column gap-3 w-100">
                            <div class="d-flex flex-column gap-2 w-100">
                                <label for="email">B!te ID Email Address</label>
                                <div class="d-flex align-items-center gap-2 input_box">
                                    <div class="d-block">
                                        <img class="w-100 h-100" src="{% static 'restaurants/images/user.png' %}" alt="user icon" />
                                    </div>
                                    <input id="email" name="email" class="w-100" type="email" placeholder="Enter B!te ID Email" required/>
                                </div>
                            </div>
                            <div class="d-flex flex-column justify-content-center align-items-center gap-3">
                                <button type="submit">Send Reset Link</button>
                                <a class="primary_btn" href="{% url 'login' restaurant_slug %}">Back to Login</a>
                            </div>
                        </div>
                    </div>
                    <span class="d-md-block d-none ps-4">Version 2.2.2</span>
                </form>
            </div>
            <div class="col-md-6 h-100 p-md-4 p-0 order-md-2 order-1">
                <div class="d-block h-100 login_banner">
                    <img class="w-100 h-100" src="{{ restaurant.landing_page_image.url }}" alt="login banner" />
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
