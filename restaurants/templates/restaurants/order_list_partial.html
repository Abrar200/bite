{% for order in orders %}
<div class="card mb-3" id="order-{{ order.id }}">
  <div class="card-body">
    <h5 class="card-title">Order #{{ order.id }}</h5>
    <p class="card-text">Status: {{ order.get_status_display }}</p>
    <p class="card-text">Total: ${{ order.total_price }}</p>
    <p class="card-text">Type: {{ order.get_order_type_display }}</p>
    <a
      href="{% url 'order_detail' slug=order.restaurant.slug order_id=order.id %}"
      class="btn btn-primary"
      >View Details</a
    >
  </div>
</div>
{% empty %}
<p>No recent orders.</p>
{% endfor %}
